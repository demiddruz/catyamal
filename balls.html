<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>10 мячей</title><style>body{margin:0;background:#5fa84f;color:#fff;font-family:"Segoe UI",Arial,sans-serif;padding:16px}h1{font-size:22px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{background:#1b2238;border-radius:14px;padding:10px;text-align:center}.card h2{font-size:16px;margin:6px 0 0;color:#ffe08a}canvas{width:100%;display:block}</style></head><body><h1>Мячи для футбола — выбери номер</h1><div class="grid" id="g"></div><script>const BALLS=['Классика', 'Барса', 'Огонь', 'Лёд', 'Золото', 'Арбуз', 'Пляж', 'Космос', 'Неон', 'Триколор'];let ctx;const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function drawBall(x, y, r, k, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(2, r * 0.9, r * 0.9, r * 0.35, 0, 0, 7); ctx.fill();
  const base = ['#fff', '#1d3f8f', '#ff6a1f', '#bfe9ff', '#ffd700', '#2ecc71', '#fff', '#1a1040', '#0b0b12', '#fff'][k];
  ctx.fillStyle = base; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.clip();
  if (k === 0) { ctx.fillStyle = '#111'; for (let i = 0; i < 5; i++) { const a = i * 1.2566 + 0.3; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62, r * 0.3, 0, 7); ctx.fill(); } ctx.beginPath(); ctx.arc(0, 0, r * 0.28, 0, 7); ctx.fill(); }
  if (k === 1) { ctx.fillStyle = '#a3193a'; for (let i = -2; i <= 2; i++) ctx.fillRect(i * r * 0.5 - r * 0.12, -r, r * 0.25, r * 2); ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(0, 0, r * 0.22, 0, 7); ctx.fill(); }
  if (k === 2) { ctx.fillStyle = '#ffd34d'; for (let i = 0; i < 6; i++) { const a = i * 1.047; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(Math.cos(a) * r, Math.sin(a) * r * 0.3, Math.cos(a + 0.5) * r * 1.1, Math.sin(a + 0.5) * r * 1.1); ctx.quadraticCurveTo(Math.cos(a + 0.3) * r * 0.5, Math.sin(a + 0.3) * r * 0.5, 0, 0); ctx.fill(); } ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(0, 0, r * 0.25, 0, 7); ctx.fill(); }
  if (k === 3) { ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.12; for (let i = 0; i < 3; i++) { const a = i * 1.047; ctx.beginPath(); ctx.moveTo(-Math.cos(a) * r, -Math.sin(a) * r); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.stroke(); } ctx.fillStyle = '#ffffffaa'; ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.3, r * 0.22, 0, 7); ctx.fill(); }
  if (k === 4) { ctx.fillStyle = '#b8860b'; for (let i = 0; i < 5; i++) { const a = i * 1.2566 + 0.3; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62, r * 0.28, 0, 7); ctx.fill(); } ctx.fillStyle = '#fff6b0'; ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.35, r * 0.2, 0, 7); ctx.fill(); }
  if (k === 5) { ctx.strokeStyle = '#1e8c46'; ctx.lineWidth = r * 0.14; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * r * 0.4, -r); ctx.quadraticCurveTo(i * r * 0.6, 0, i * r * 0.4, r); ctx.stroke(); } }
  if (k === 6) { const cols = ['#e63946', '#ffd700', '#3b82f6', '#2ecc71', '#ff9f1c', '#fff']; for (let i = 0; i < 6; i++) { ctx.fillStyle = cols[i]; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, i * 1.047, (i + 1) * 1.047); ctx.closePath(); ctx.fill(); } }
  if (k === 7) { ctx.fillStyle = '#fff'; for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.arc(Math.cos(i * 2.4) * r * (0.2 + (i % 5) * 0.15), Math.sin(i * 2.4) * r * (0.2 + (i % 4) * 0.18), 1.2 + (i % 3) * 0.6, 0, 7); ctx.fill(); } ctx.fillStyle = '#8e44ad88'; ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.35, 0.6, 0, 7); ctx.fill(); }
  if (k === 8) { ctx.strokeStyle = '#39ff14'; ctx.lineWidth = r * 0.1; ctx.beginPath(); ctx.arc(0, 0, r * 0.65, 0, 7); ctx.stroke(); for (let i = 0; i < 6; i++) { const a = i * 1.047; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.65, Math.sin(a) * r * 0.65); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.stroke(); } }
  if (k === 9) { ctx.fillStyle = '#0039a6'; ctx.fillRect(-r, -r / 3, 2 * r, 2 * r / 3); ctx.fillStyle = '#d52b1e'; ctx.fillRect(-r, r / 3, 2 * r, r); }
  ctx.restore(); ctx.strokeStyle = '#0005'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke(); ctx.fillStyle = '#ffffff66'; ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.4, r * 0.18, 0, 7); ctx.fill();
  ctx.restore();
}
BALLS.forEach((n,i)=>{const c=document.createElement("div");c.className="card";const cv=document.createElement("canvas");cv.width=cv.height=160;c.appendChild(cv);const h=document.createElement("h2");h.textContent=(i+1)+". "+n;c.appendChild(h);document.getElementById("g").appendChild(c);ctx=cv.getContext("2d");ctx.fillStyle="#6fb85e";ctx.fillRect(0,0,160,160);drawBall(80,80,52,i,0.3);});</script></body></html>
