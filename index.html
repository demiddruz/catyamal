}

  try {
    const a = ac(), n = a.sampleRate * dur, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);

  } catch (e) {}
}

function drawEars(kind) { // в системе координат головы: глаза на y=0, морда ~46 шириной
  const pink = '#e9a7b5';
  for (const sd of [-1, 1]) {

    ctx.fillStyle = CAT.brown;

  }

function catHead(x, y, s, mood = 'calm', ears) { // s=1 → голова ~62px шириной, глаза на уровне y

function kitStripes(L, R, y, h, w, x, kit) { // полосы домашней формы по варианту
  const A = kit.swap ? '#004d98' : '#a50044', B = kit.swap ? '#a50044' : '#004d98';
  if (kit.photo) { ctx.fillStyle = '#1d3f8f'; ctx.fillRect(L, y, R - L, h); ctx.fillStyle = '#a50044'; ctx.fillRect(x - w * 0.34, y, w * 0.68, h); ctx.fillStyle = '#1d3f8f'; for (const dx of [-0.2, 0, 0.2]) ctx.fillRect(x + dx * w - w * 0.025, y, w * 0.05, h); return; }

}

// ───────────────────────── свой мир ─────────────────────────
const TW = 30, TCOLS = 32, TROWS = 17, TILES = [
  { n: 'Трава', c: '#7cc46a' }, { n: 'Песок', c: '#efd99a' }, { n: 'Вода', c: '#4fb6e8' }, { n: 'Снег', c: '#f3f7fb' }, { n: 'Асфальт', c: '#7d7d86' }, { n: 'Цветы', c: '#7cc46a' }, { n: 'Дерево', c: '#7cc46a' }, { n: 'Кафель', c: '#bfe6f5' }];
let sb = { brush: 0, mode: 'paint', who: 'cat', px: W / 2, py: 260, legT: 0 };
S.level = clamp(S.level, 1, TOTAL); S.best = clamp(S.best, 1, TOTAL);
if (!S.tiles || S.tiles.length !== TCOLS * TROWS) S.tiles = new Array(TCOLS * TROWS).fill(0);
function sandboxPaint(x, y) { if (sb.mode !== 'paint' || y > 50 + TROWS * TW) return; const c = Math.floor(x / TW), r = Math.floor((y - 50) / TW); if (c >= 0 && c < TCOLS && r >= 0 && r < TROWS) { S.tiles[r * TCOLS + c] = sb.brush; } }
function tileAt(x, y) { const c = Math.floor(x / TW), r = Math.floor((y - 50) / TW); return (c < 0 || c >= TCOLS || r < 0 || r >= TROWS) ? 6 : S.tiles[r * TCOLS + c]; }
function updateSandbox(dt) {
  if (sb.mode !== 'walk') return;
  let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0), dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (pointer.down && !pointer.btn) { const px = pointer.x - sb.px, py = pointer.y - sb.py, d = Math.hypot(px, py); if (d > 12) { dx = px / d; dy = py / d; } }
  const dl = Math.hypot(dx, dy) || 1; if (dl > 1) { dx /= dl; dy /= dl; }
  const sp = tileAt(sb.px, sb.py) === 2 ? 110 : 230, nx = sb.px + dx * sp * dt, ny = sb.py + dy * sp * dt;
  if (tileAt(nx, sb.py) !== 6) sb.px = nx; if (tileAt(sb.px, ny) !== 6) sb.py = ny;
  sb.px = clamp(sb.px, 20, W - 20); sb.py = clamp(sb.py, 70, 50 + TROWS * TW - 20);
  if (Math.abs(dx) + Math.abs(dy) > 0.1) sb.legT += dt * 14;
}
function drawSandbox() {
  ctx.fillStyle = '#1b2238'; ctx.fillRect(0, 0, W, H);
  for (let r = 0; r < TROWS; r++) for (let c = 0; c < TCOLS; c++) {
    const k = S.tiles[r * TCOLS + c], x = c * TW, y = 50 + r * TW; ctx.fillStyle = TILES[k].c; ctx.fillRect(x, y, TW, TW);
    if (k === 2) { ctx.fillStyle = '#ffffff55'; ctx.fillRect(x + 4, y + 8 + Math.sin(performance.now() / 400 + c) * 3, 12, 2); }
    if (k === 5) { ctx.fillStyle = ['#ff6b9d', '#ffe66d', '#fff'][(c + r) % 3]; ctx.beginPath(); ctx.arc(x + 10, y + 12, 4, 0, 7); ctx.arc(x + 21, y + 20, 4, 0, 7); ctx.fill(); }
    if (k === 6) { ctx.fillStyle = '#6b4423'; ctx.fillRect(x + 12, y + 14, 6, 14); ctx.fillStyle = '#2e8b57'; ctx.beginPath(); ctx.arc(x + 15, y + 11, 11, 0, 7); ctx.fill(); }
    if (k === 7) { ctx.strokeStyle = '#8fc5d8'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, TW - 1, TW - 1); }
  }
  if (sb.mode === 'walk') {
    const inWater = tileAt(sb.px, sb.py) === 2;
    if (inWater) { ctx.fillStyle = '#ffffff88'; ctx.beginPath(); ctx.ellipse(sb.px, sb.py + 14, 30, 10, 0, 0, 7); ctx.fill(); }
    ctx.save(); if (inWater) { ctx.beginPath(); ctx.rect(0, 0, W, sb.py + 12); ctx.clip(); }
    if (sb.who === 'cat') drawCat(sb.px, sb.py, 0.95, { legT: sb.legT, mood: inWater ? 'shock' : 'happy' }); else drawBoy(sb.px, sb.py + 20, 1.1, { legT: sb.legT, mouth: inWater ? 0.6 : 0 });
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(20,24,48,0.9)'; ctx.fillRect(0, 0, W, 50);
  text('Свой мир — рисуй: от пустыни до Красноярска, бассейны и парки', 14, 31, 16, '#ffe08a', 'left');
  btn(W - 60, 8, 50, 32, '✕', () => { save(); screen = 'menu'; }, '#555', true);
  const by = 50 + TROWS * TW + 6;
  TILES.forEach((t, i) => btn(10 + i * 92, by, 86, 34, t.n, () => { sb.brush = i; sb.mode = 'paint'; }, sb.mode === 'paint' && sb.brush === i ? '#2ecc71' : '#3b82f6', true));
  btn(W - 210, by, 95, 34, 'Гулять', () => sb.mode = 'walk', sb.mode === 'walk' ? '#2ecc71' : '#16a085', true);
  btn(W - 110, by, 100, 34, sb.who === 'cat' ? 'Котик' : 'Мальчик', () => sb.who = sb.who === 'cat' ? 'boy' : 'cat', '#9b59b6', true);
  // очистить — на верхней панели
  btn(W - 180, 8, 110, 32, 'Очистить', () => { S.tiles.fill(0); save(); }, '#c0392b', true);
}

// ───────────────────────── цикл ─────────────────────────
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; buttons = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  if (screen !== 'model3d') { const c3 = document.getElementById('c3'); if (c3.style.display !== 'none') c3.style.display = 'none'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  if (screen === 'game') { update(dt); drawGame(); }
  else if (screen === 'menu') drawMenu();
  else if (screen === 'map') drawMap();
  else if (screen === 'end') drawEnd();
  else if (screen === 'kitchen') drawKitchen();
  else if (screen === 'wardrobe') drawWardrobe();
  else if (screen === 'arms') drawArms();
  else if (screen === 'cats') drawCats();
  else if (screen === 'ears') drawEarsScreen();
  else if (screen === 'lashes') drawLashesScreen();
  else if (screen === 'heads') drawHeadsScreen();
  else if (screen === 'kits') drawKitsScreen();
  else if (screen === 'logos') drawLogosScreen();
  else if (screen === 'boots') drawBootsScreen();
  else if (screen === 'looks') drawLooksScreen();
  else if (screen === 'model3d') { drawModel3D(); }
  else if (screen === 'sandbox') { updateSandbox(dt); drawSandbox(); }
  else if (screen === 'football') { updateFootball(dt); drawFootball(); }
  else if (screen === 'match') { updateMatch(dt); drawMatch(); }
  else if (screen === 'fmenu') drawFootballMenu();
  else if (screen === 'juggle') { updateJuggle(dt); drawJuggle(); }
  for (const m of msg) { m.life -= dt; ctx.globalAlpha = clamp(m.life / m.max * 2, 0, 1); text(m.t, m.x, m.y - (1 - m.life / m.max) * 30, 20, m.col); } ctx.globalAlpha = 1; msg = msg.filter(m => m.life > 0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
